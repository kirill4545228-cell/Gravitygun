name: Build mod from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unpack zip if needed)
        run: |
          if [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n1)
            if [ -z "$ZIP" ]; then echo "No zip file found in the repository"; exit 1; fi
            echo "Unpacking $ZIP"
            mkdir -p _unpacked
            unzip -q "$ZIP" -d _unpacked
            GRADLE=$(find _unpacked -name build.gradle | head -n1)
            if [ -z "$GRADLE" ]; then echo "build.gradle not found inside the zip"; exit 1; fi
            echo "PROJECT_DIR=$(dirname "$GRADLE")" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build jar
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/jars"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/jars/"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: gravitygun-mod
          path: jars/*.jar
